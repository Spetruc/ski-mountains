name: Expand US resort directory (OpenStreetMap)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Add candidates to resorts.json (false creates review report only)'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query OpenStreetMap and prepare report
        run: python scripts/import_osm_resorts.py ${{ inputs.apply_changes && '--apply' || '--preview' }}
      - name: Upload batch checkpoints (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-batches
          path: data/osm_batches/
          if-no-files-found: ignore
      - name: Upload candidate review report
        uses: actions/upload-artifact@v4
        with:
          name: osm-candidates
          path: data/osm_import_report.json
      - name: Commit resort expansion
        if: inputs.apply_changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resorts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add OSM resort candidates'
            git push
          fi
